# Fallback project definition. The checked-in LittleSpaceProgram.xcodeproj is the
# primary route — open it and press Run. If it ever gets out of step, regenerate it
# with `xcodegen generate` (brew install xcodegen).
name: LittleSpaceProgram
options:
  bundleIdPrefix: com.littlespaceprogram
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  LittleSpaceProgram:
    type: application
    platform: iOS
    sources:
      - path: LittleSpaceProgram
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.littlespaceprogram.app
        PRODUCT_NAME: LittleSpaceProgram
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
        INFOPLIST_KEY_CFBundleDisplayName: Little Space Program
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIStatusBarHidden: true
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
